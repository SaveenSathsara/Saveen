<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saveen Sathsara</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css?v=3.0" rel="stylesheet">
</head>
<body class="bg-gray-50 dark:bg-[#0f172a] text-gray-900 dark:text-white font-sans antialiased overflow-x-hidden transition-colors duration-300 selection:bg-brand-500 selection:text-white">
    <!-- Background Animated Shapes -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand-400 dark:bg-brand-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-30 dark:opacity-50 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-purple-400 dark:bg-purple-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-30 dark:opacity-50 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-pink-400 dark:bg-pink-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-30 dark:opacity-50 animate-blob animation-delay-4000"></div>
    </div>

    <!-- Main Application Container -->
    <div id="app" class="relative z-10 min-h-screen flex flex-col w-full">
        <!-- Dynamic content injected here -->
    </div>

    <!-- Scripts -->
    <script>
        // Init theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
    </script>
    <script src="js/data.js?v=3.0"></script>
    <script src="js/app.js?v=3.0"></script>
</body>
</html>
